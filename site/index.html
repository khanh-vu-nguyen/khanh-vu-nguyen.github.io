<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Your name as it should appear in the browser tab -->
  <title>Khanh Vu</title>
  <!-- The summary shown in search results and when the link is shared -->
  <meta name="description" content="Khanh Vu, MA Candidate at the University of Salzburg.">
  <meta property="og:title" content="Khanh Vu">
  <meta property="og:description" content="MA Candidate, University of Salzburg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://khanh-vu-nguyen.github.io/">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <!-- Your name -->
      <h1>Khanh Vu</h1>
      <!-- Your position, e.g. "PhD Student in Philosophy, University" -->
      <p class="role">MA Candidate, University of Salzburg</p>

      <!--
        Links. Put the address between the quotes after href.
        Any link left as href="" is hidden automatically.
          - CV:     upload your file as site/cv.pdf, then use href="cv.pdf"
          - Email:  shown with [at] instead of @. script.js turns it into a clickable link,
                    so the real address never appears in this file. To change it, edit
                    data-user, data-domain and the visible text.
          - Others: paste the full address, e.g. href="https://bsky.app/profile/you"
      -->
      <nav>
        <a href="">CV</a>
        <a class="email" data-user="khanhvu2004work" data-domain="gmail.com">khanhvu2004work[at]gmail.com</a>
        <a href="">PhilPeople</a>
        <a href="">Google Scholar</a>
        <a href="">PhilPapers</a>
        <a href="">Bluesky</a>
        <a href="">X</a>
        <a href="https://www.linkedin.com/in/kvu1904/">LinkedIn</a>
        <a href="">GitHub</a>
      </nav>
    </header>

    <section id="about" class="about">
      <!-- Upload a photo as site/photo.jpg and it appears here; otherwise nothing shows -->
      <img src="photo.jpg" alt="" class="portrait" onerror="this.remove()">
      <div>
        <!-- Your bio. Add more <p></p> lines for more paragraphs. -->
        <p></p>
      </div>
    </section>

    <section id="research">
      <h2>Research</h2>

      <h3>Book</h3>
      <ul class="pubs">
        <!--
          Copy this block once per item, and remove the comment markers around it.
          href: a PDF you uploaded to site/papers/ (href="papers/my-paper.pdf")
                or a journal / PhilArchive link (href="https://...").
          Leave href="" for a title with no link.

        <li>
          <a class="title" href=""></a>
          <span class="venue"></span>
          <details><summary>Abstract</summary>
            <p></p>
          </details>
        </li>
        -->
      </ul>

      <h3>Papers</h3>
      <ul class="pubs">
        <!-- Same block as above.
        <li>
          <a class="title" href=""></a>
          <span class="venue"></span>
          <details><summary>Abstract</summary>
            <p></p>
          </details>
        </li>
        -->
      </ul>

      <h3>Drafts</h3>
      <ul class="pubs">
        <!-- Upload drafts to site/drafts/ and link them with href="drafts/my-draft.pdf".
        <li>
          <a class="title" href=""></a>
          <span class="venue"></span>
          <details><summary>Abstract</summary>
            <p></p>
          </details>
        </li>
        -->
      </ul>
    </section>

    <section id="teaching">
      <h2>Teaching</h2>
      <ul class="plain">
        <!-- One line per course:
        <li><span class="course"></span> </li>
        -->
      </ul>
    </section>

    <footer>
      <!-- Department, address, office -->
      <p></p>
      <!-- Filled in automatically with the date the site was last published -->
      <p id="updated"></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
